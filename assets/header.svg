<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="0.55" stop-color="#0E1A2E"/>
      <stop offset="1" stop-color="#14254A"/>
    </linearGradient>
    <linearGradient id="saldo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F6FEB"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#8B949E" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="fade" cx="0.75" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="380" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    .glow-a { animation: flota 14s ease-in-out infinite; }
    .glow-b { animation: flota 18s ease-in-out infinite reverse; }
    @keyframes flota { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-40px, 26px); } }

    .entra { opacity: 0; animation: entra 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.5s; }
    .d4 { animation-delay: 0.7s; } .d5 { animation-delay: 0.9s; } .d6 { animation-delay: 1.1s; } .d7 { animation-delay: 1.3s; }
    @keyframes entra { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .frase { opacity: 0; animation: frase 16s infinite; }
    .f2 { animation-delay: 4s; } .f3 { animation-delay: 8s; } .f4 { animation-delay: 12s; }
    @keyframes frase { 0% { opacity: 0; } 3%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }

    .cursor { animation: parpadeo 1s steps(1) infinite; }
    @keyframes parpadeo { 50% { opacity: 0; } }

    /* Datos viajando entre las capas */
    .flujo { stroke-dasharray: 3 7; animation: fluye 1.2s linear infinite; }
    .flujo.lento { animation-duration: 1.8s; }
    @keyframes fluye { to { stroke-dashoffset: -20; } }

    /* Barras del panel web que crecen y respiran */
    .barra { transform-box: fill-box; transform-origin: 50% 100%; animation: crece 4s ease-in-out infinite; }
    .b2 { animation-delay: 0.3s; } .b3 { animation-delay: 0.6s; } .b4 { animation-delay: 0.9s; } .b5 { animation-delay: 1.2s; } .b6 { animation-delay: 1.5s; }
    @keyframes crece { 0%, 100% { transform: scaleY(0.55); } 50% { transform: scaleY(1); } }

    /* Producción encendida */
    .led { animation: led 2.4s ease-in-out infinite; }
    .l2 { animation-delay: 0.4s; } .l3 { animation-delay: 0.8s; }
    @keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .pulso { transform-box: fill-box; transform-origin: center; animation: pulso 2s ease-out infinite; }
    @keyframes pulso { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(3); opacity: 0; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)" mask="url(#gridMask)"/>
    <circle class="glow-a" cx="960" cy="120" r="150" fill="#1F6FEB" fill-opacity="0.40" filter="url(#blur)"/>
    <circle class="glow-b" cx="760" cy="330" r="120" fill="#A371F7" fill-opacity="0.26" filter="url(#blur)"/>

    <!-- ───────── Texto ───────── -->
    <text x="72" y="90" class="mono entra d1" font-size="16" fill="#8B949E"><tspan fill="#A371F7">const</tspan> dev <tspan fill="#F78166">=</tspan></text>
    <text x="68" y="160" class="sans entra d2" font-size="76" font-weight="800" letter-spacing="-2" fill="#F0F6FC">Camilo Ferrera</text>
    <text x="74" y="204" class="sans entra d3" font-size="20" font-weight="700" letter-spacing="5" fill="#E6EDF3">FULL STACK <tspan fill="#58A6FF">DEVELOPER</tspan></text>

    <g class="entra d4">
      <rect x="72" y="240" width="560" height="54" rx="12" fill="#0D1117" fill-opacity="0.85" stroke="#30363D"/>
      <circle cx="94" cy="267" r="4" fill="#FF5F56"/>
      <circle cx="108" cy="267" r="4" fill="#FFBD2E"/>
      <circle cx="122" cy="267" r="4" fill="#27C93F"/>
      <text x="142" y="273" class="mono" font-size="17" fill="#3FB950">❯</text>
      <g class="mono" font-size="17" fill="#C9D1D9">
        <text x="164" y="273" class="frase">APIs en TypeScript y Rust<tspan class="cursor" fill="#58A6FF"> ▍</tspan></text>
        <text x="164" y="273" class="frase f2">apps móviles con React Native + Expo<tspan class="cursor" fill="#58A6FF"> ▍</tspan></text>
        <text x="164" y="273" class="frase f3">paneles web con React + Vite<tspan class="cursor" fill="#58A6FF"> ▍</tspan></text>
        <text x="164" y="273" class="frase f4">servidores listos para producción<tspan class="cursor" fill="#58A6FF"> ▍</tspan></text>
      </g>
    </g>

    <!-- ───────── Ilustración: de la idea a producción ───────── -->

    <!-- Conexiones (debajo de los nodos) -->
    <g stroke-width="2" stroke-linecap="round" class="entra d7">
      <path class="flujo" d="M780 198 C780 222 872 214 872 238" stroke="#58A6FF" stroke-opacity="0.8"/>
      <path class="flujo" d="M962 192 C962 214 952 216 952 238" stroke="#A371F7" stroke-opacity="0.8"/>
      <path class="flujo" d="M994 264 L1044 264" stroke="#58A6FF" stroke-opacity="0.8"/>
      <path class="flujo lento" d="M912 290 L912 316" stroke="#3FB950" stroke-opacity="0.8"/>
    </g>

    <!-- Móvil -->
    <g class="entra d4">
      <rect x="740" y="58" width="80" height="140" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
      <rect x="767" y="65" width="26" height="5" rx="2.5" fill="#30363D"/>
      <rect x="750" y="80" width="60" height="32" rx="7" fill="url(#saldo)"/>
      <rect x="757" y="88" width="22" height="4" rx="2" fill="#F0F6FC" fill-opacity="0.6"/>
      <rect x="757" y="98" width="36" height="7" rx="3.5" fill="#F0F6FC"/>
      <rect x="750" y="122" width="44" height="5" rx="2.5" fill="#30363D"/>
      <rect x="750" y="134" width="56" height="5" rx="2.5" fill="#30363D"/>
      <rect x="750" y="146" width="36" height="5" rx="2.5" fill="#30363D"/>
      <rect x="750" y="172" width="60" height="14" rx="7" fill="#1F6FEB"/>
    </g>

    <!-- Web -->
    <g class="entra d5">
      <rect x="850" y="62" width="224" height="130" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
      <circle cx="865" cy="77" r="3.5" fill="#FF5F56"/>
      <circle cx="877" cy="77" r="3.5" fill="#FFBD2E"/>
      <circle cx="889" cy="77" r="3.5" fill="#27C93F"/>
      <rect x="904" y="71" width="156" height="12" rx="6" fill="#161B22"/>
      <rect x="858" y="92" width="38" height="92" rx="5" fill="#161B22"/>
      <rect x="865" y="101" width="24" height="4" rx="2" fill="#58A6FF"/>
      <rect x="865" y="113" width="20" height="4" rx="2" fill="#30363D"/>
      <rect x="865" y="125" width="24" height="4" rx="2" fill="#30363D"/>
      <rect x="865" y="137" width="16" height="4" rx="2" fill="#30363D"/>
      <line x1="906" y1="178" x2="1064" y2="178" stroke="#30363D"/>
      <rect class="barra"    x="910"  y="140" width="16" height="38" rx="3" fill="#58A6FF"/>
      <rect class="barra b2" x="935"  y="122" width="16" height="56" rx="3" fill="#7D8CFA"/>
      <rect class="barra b3" x="960"  y="132" width="16" height="46" rx="3" fill="#A371F7"/>
      <rect class="barra b4" x="985"  y="108" width="16" height="70" rx="3" fill="#58A6FF"/>
      <rect class="barra b5" x="1010" y="118" width="16" height="60" rx="3" fill="#7D8CFA"/>
      <rect class="barra b6" x="1035" y="98"  width="16" height="80" rx="3" fill="#F78166"/>
    </g>

    <!-- API -->
    <g class="entra d6">
      <rect x="832" y="238" width="162" height="52" rx="12" fill="#0D1117" stroke="#58A6FF" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle class="pulso" cx="851" cy="264" r="4" fill="#3FB950"/>
      <circle cx="851" cy="264" r="4" fill="#3FB950"/>
      <text x="866" y="270" class="mono" font-size="16" fill="#C9D1D9"><tspan fill="#3FB950" font-weight="700">GET</tspan> /api/v1</text>
    </g>

    <!-- Base de datos -->
    <g class="entra d6">
      <path d="M1044 246 V282 A36 10 0 0 0 1116 282 V246" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
      <path d="M1044 264 A36 10 0 0 0 1116 264" stroke="#30363D" stroke-width="1.5"/>
      <ellipse cx="1080" cy="246" rx="36" ry="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <text x="1080" y="284" class="mono" font-size="12" fill="#8B949E" text-anchor="middle">SQL</text>
    </g>

    <!-- Producción -->
    <g class="entra d7">
      <rect x="760" y="316" width="360" height="40" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
      <circle class="led"    cx="780" cy="336" r="4" fill="#3FB950"/>
      <circle class="led l2" cx="794" cy="336" r="4" fill="#3FB950"/>
      <circle class="led l3" cx="808" cy="336" r="4" fill="#3FB950"/>
      <text x="826" y="341" class="mono" font-size="13" fill="#8B949E"><tspan fill="#C9D1D9">prod</tspan>  ·  docker  ·  nginx  ·  vpn</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="27.5" stroke="#30363D"/>
</svg>
