<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="0.55" stop-color="#0E1A2E"/>
      <stop offset="1" stop-color="#14254A"/>
    </linearGradient>
    <linearGradient id="role" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#F78166"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A371F7" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8B949E" fill-opacity="0.16"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .glow-a { animation: flota 14s ease-in-out infinite; }
    .glow-b { animation: flota 18s ease-in-out infinite reverse; }
    @keyframes flota { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-40px, 26px); } }
    .entra { opacity: 0; animation: entra 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; } .d4 { animation-delay: 0.85s; }
    @keyframes entra { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .frase { opacity: 0; animation: frase 16s infinite; }
    .f2 { animation-delay: 4s; } .f3 { animation-delay: 8s; } .f4 { animation-delay: 12s; }
    @keyframes frase { 0% { opacity: 0; } 3%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }
    .cursor { animation: parpadeo 1s steps(1) infinite; }
    @keyframes parpadeo { 50% { opacity: 0; } }
    .orbita-1 { transform-origin: 960px 190px; animation: gira 22s linear infinite; }
    .orbita-2 { transform-origin: 960px 190px; animation: gira 34s linear infinite reverse; }
    .orbita-3 { transform-origin: 960px 190px; animation: gira 48s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <circle class="glow-a" cx="980" cy="120" r="150" fill="#1F6FEB" fill-opacity="0.45" filter="url(#blur)"/>
    <circle class="glow-b" cx="760" cy="330" r="120" fill="#A371F7" fill-opacity="0.30" filter="url(#blur)"/>

    <!-- Órbitas: frontend, móvil y backend girando alrededor del núcleo -->
    <circle cx="960" cy="190" r="62" stroke="url(#ring)" stroke-width="1.5"/>
    <circle cx="960" cy="190" r="108" stroke="url(#ring)" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="960" cy="190" r="154" stroke="url(#ring)" stroke-width="1.5"/>
    <g class="orbita-1"><circle cx="1022" cy="190" r="9" fill="#61DAFB"/></g>
    <g class="orbita-2"><circle cx="852" cy="190" r="8" fill="#3178C6"/><circle cx="1068" cy="190" r="6" fill="#F7DF1E"/></g>
    <g class="orbita-3"><circle cx="960" cy="36" r="10" fill="#F74C00"/><circle cx="960" cy="344" r="7" fill="#5FA04E"/></g>
    <rect x="922" y="152" width="76" height="76" rx="20" fill="#0D1117" stroke="#30363D"/>
    <text x="960" y="200" class="mono" font-size="30" font-weight="700" fill="#E6EDF3" text-anchor="middle">&lt;/&gt;</text>

    <text x="68" y="150" class="sans entra d2" font-size="76" font-weight="800" letter-spacing="-2" fill="#F0F6FC">Camilo Ferrera</text>
    <text x="72" y="196" class="sans entra d3" font-size="28" font-weight="700" fill="url(#role)">Full Stack Developer</text>

    <g class="entra d4">
      <rect x="72" y="234" width="560" height="54" rx="12" fill="#0D1117" fill-opacity="0.85" stroke="#30363D"/>
      <circle cx="94" cy="261" r="4" fill="#FF5F56"/>
      <circle cx="108" cy="261" r="4" fill="#FFBD2E"/>
      <circle cx="122" cy="261" r="4" fill="#27C93F"/>
      <text x="142" y="267" class="mono" font-size="17" fill="#3FB950">❯</text>
      <g class="mono" font-size="17" fill="#C9D1D9">
        <text x="164" y="267" class="frase">APIs en TypeScript y Rust<tspan class="cursor" fill="#58A6FF"> ▍</tspan></text>
        <text x="164" y="267" class="frase f2">apps móviles con React Native + Expo<tspan class="cursor" fill="#58A6FF"> ▍</tspan></text>
        <text x="164" y="267" class="frase f3">paneles web con React + Vite<tspan class="cursor" fill="#58A6FF"> ▍</tspan></text>
        <text x="164" y="267" class="frase f4">servidores listos para producción<tspan class="cursor" fill="#58A6FF"> ▍</tspan></text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="27.5" stroke="#30363D"/>
</svg>
